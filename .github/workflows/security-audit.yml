name: Security audit

on:
  schedule:
    - cron: "20 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:security
