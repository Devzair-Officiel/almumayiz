services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: almumayiz:latest
    container_name: almumayiz
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    volumes:
      - almumayiz_article_uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - caddy_net
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  db:
    image: postgres:18-alpine
    container_name: almumayiz-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - almumayiz_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  almumayiz_pgdata:
    name: almumayiz_pgdata
  almumayiz_article_uploads:
    name: almumayiz_article_uploads

networks:
  caddy_net:
    external: true
  backend:
