services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Régénère le client Prisma à chaque démarrage puis lance le dev server.
    command: sh -c "npx prisma generate && npm run dev"
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - almumayiz_article_uploads_dev:/app/public/uploads
    environment:
      - WATCHPACK_POLLING=true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: almumayiz-db-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - almumayiz_pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  almumayiz_pgdata_dev:
    name: almumayiz_pgdata_dev
  almumayiz_article_uploads_dev:
    name: almumayiz_article_uploads_dev
